<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>SRYVERSE</title>
  <script>
    // GitHub Pages sunucu tarafinda yonlendirme yapamaz; bilinmeyen bir
    // adres istendiginde bu sayfayi doner. Adresi oldugu gibi koruyup
    // koke yonlendiriyoruz, uygulama acilinca dogru sayfayi gosterir.
    (function () {
      var l = window.location;
      var path = l.pathname.replace(/^\/+/, '');
      if (path) {
        sessionStorage.setItem('sry:redirect', '/' + path + l.search + l.hash);
      }
      l.replace('/');
    })();
  </script>
</head>
<body></body>
</html>
